name: Build Pine v1.5 Candidate

on:
  workflow_dispatch:
  push:
    paths:
      - 'pine-script/master-smc-sats/03_SCRIPT_BLOCKS/06_smart_key_level_engine.pine'
      - 'pine-script/master-smc-sats/03_SCRIPT_BLOCKS/98_assemble_v1_5_candidate.py'
      - 'pine-script/master-smc-sats/01_BASE_WORKING_VERSION/master-smc-sats-ravi-custom-01-v1.4-LAST-WORKING.pine'

permissions:
  contents: write

jobs:
  build-v15-candidate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Assemble v1.5 candidate
        run: python pine-script/master-smc-sats/03_SCRIPT_BLOCKS/98_assemble_v1_5_candidate.py

      - name: Commit generated candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pine-script/master-smc-sats/03_MASTER_CANDIDATES/master-smc-sats-ravi-custom-01-v1.5-smart-key-liquidity-candidate.pine
          if git diff --cached --quiet; then
            echo "No candidate changes to commit."
          else
            git commit -m "Build v1.5 smart key liquidity candidate"
            git push
          fi
