name: Build Pine v1.7 Settings UI Candidate

on:
  workflow_dispatch:
  push:
    paths:
      - 'pine-script/master-smc-sats/03_SCRIPT_BLOCKS/98_assemble_v1_7_settings_ui_candidate.py'
      - 'pine-script/master-smc-sats/03_SCRIPT_BLOCKS/98_assemble_v1_6_theme_candidate.py'
      - 'pine-script/master-smc-sats/03_SCRIPT_BLOCKS/98_assemble_v1_5_candidate.py'
      - 'pine-script/master-smc-sats/03_SCRIPT_BLOCKS/09a_theme_engine.pine'
      - 'pine-script/master-smc-sats/03_SCRIPT_BLOCKS/07_entry_workflow_engine.pine'
      - 'pine-script/master-smc-sats/03_SCRIPT_BLOCKS/06_smart_key_level_engine.pine'
      - 'pine-script/master-smc-sats/01_BASE_WORKING_VERSION/master-smc-sats-ravi-custom-01-v1.4-LAST-WORKING.pine'

permissions:
  contents: write

concurrency:
  group: pine-v17-settings-ui-candidate-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build v1.7 settings UI candidate
        run: python pine-script/master-smc-sats/03_SCRIPT_BLOCKS/98_assemble_v1_7_settings_ui_candidate.py

      - name: Commit generated candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pine-script/master-smc-sats/03_MASTER_CANDIDATES/master-smc-sats-ravi-custom-01-v1.7-settings-ui-cleanup-candidate.pine
          if git diff --cached --quiet; then
            echo "No v1.7 candidate changes to commit."
            exit 0
          fi
          git commit -m "Build Pine v1.7 settings UI candidate"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
