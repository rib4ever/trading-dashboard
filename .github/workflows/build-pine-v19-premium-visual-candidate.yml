name: Build Pine v1.9 Premium Visual Candidate

on:
  workflow_dispatch:
  push:
    paths:
      - 'pine-script/master-smc-sats/03_SCRIPT_BLOCKS/12_premium_visual_hierarchy_engine.pine'
      - 'pine-script/master-smc-sats/03_SCRIPT_BLOCKS/11_fibonacci_poi_engine.pine'
      - 'pine-script/master-smc-sats/03_SCRIPT_BLOCKS/98_assemble_v1_9_premium_visual_candidate.py'
      - 'pine-script/master-smc-sats/03_SCRIPT_BLOCKS/98_assemble_v1_8_fibonacci_poi_candidate.py'
      - 'pine-script/master-smc-sats/03_MASTER_CANDIDATES/master-smc-sats-ravi-custom-01-v1.8-fibonacci-poi-candidate.pine'
      - 'pine-script/master-smc-sats/00_MASTER_COMPILED/master-smc-sats-ravi-custom-01-v1.7-CONFIRMED-WORKING.pine'

permissions:
  contents: write

concurrency:
  group: pine-v19-premium-visual-candidate-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build v1.9 premium visual candidate
        run: python pine-script/master-smc-sats/03_SCRIPT_BLOCKS/98_assemble_v1_9_premium_visual_candidate.py

      - name: Commit generated candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pine-script/master-smc-sats/03_MASTER_CANDIDATES/master-smc-sats-ravi-custom-01-v1.9-premium-visual-candidate.pine
          if git diff --cached --quiet; then
            echo "No v1.9 candidate changes to commit."
            exit 0
          fi
          git commit -m "Build Pine v1.9 premium visual candidate"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
