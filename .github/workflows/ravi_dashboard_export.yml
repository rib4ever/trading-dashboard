name: Ravi Dashboard Export

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-dashboard-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r ravi-trading-journal-os/requirements.txt
      - name: Fill missing Trade IDs
        run: |
          cd ravi-trading-journal-os
          PYTHONPATH=. python scripts/run_trade_maintenance.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_TRADES_DATABASE_ID: ${{ secrets.NOTION_TRADES_DATABASE_ID }}
      - name: Export dashboard data
        run: |
          cd ravi-trading-journal-os
          PYTHONPATH=. python scripts/run_dashboard_export.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_TRADES_DATABASE_ID: ${{ secrets.NOTION_TRADES_DATABASE_ID }}
      - name: Commit dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ravi-dashboard/data/trades.json
          git diff --cached --quiet || git commit -m "Refresh Ravi dashboard data"
          git push
