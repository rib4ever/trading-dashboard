name: Ravi Full Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ravi-full-pipeline
  cancel-in-progress: false

jobs:
  full-pipeline:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r ravi-trading-journal-os/requirements.txt

      - name: 01 - Trade maintenance and auto calculations
        run: |
          cd ravi-trading-journal-os
          PYTHONPATH=. python scripts/run_trade_maintenance.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_TRADES_DATABASE_ID: ${{ secrets.NOTION_TRADES_DATABASE_ID }}

      - name: 02 - Screenshot sync to Google Drive
        run: |
          cd ravi-trading-journal-os
          PYTHONPATH=. python scripts/run_screenshot_sync.py
        env:
          AUTO_MARK_AI_READY_AFTER_SCREENSHOT_SYNC: "true"
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_TRADES_DATABASE_ID: ${{ secrets.NOTION_TRADES_DATABASE_ID }}
          NOTION_SCREENSHOTS_DATABASE_ID: ${{ secrets.NOTION_SCREENSHOTS_DATABASE_ID }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - run: sleep 20
      - name: 03 - AI trade review
        run: |
          cd ravi-trading-journal-os
          PYTHONPATH=. python scripts/run_ai_trade_review.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_TRADES_DATABASE_ID: ${{ secrets.NOTION_TRADES_DATABASE_ID }}
          NOTION_SCREENSHOTS_DATABASE_ID: ${{ secrets.NOTION_SCREENSHOTS_DATABASE_ID }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - run: sleep 20
      - name: 04 - Final maintenance after AI review
        run: |
          cd ravi-trading-journal-os
          PYTHONPATH=. python scripts/run_trade_maintenance.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_TRADES_DATABASE_ID: ${{ secrets.NOTION_TRADES_DATABASE_ID }}

      - name: 05 - Export dashboard data and persistent screenshot assets
        run: |
          cd ravi-trading-journal-os
          PYTHONPATH=. python scripts/run_dashboard_export.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_TRADES_DATABASE_ID: ${{ secrets.NOTION_TRADES_DATABASE_ID }}
          NOTION_SCREENSHOTS_DATABASE_ID: ${{ secrets.NOTION_SCREENSHOTS_DATABASE_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: 05b - Calculate objectives and risk guardrails
        run: |
          cd ravi-trading-journal-os
          PYTHONPATH=. python scripts/run_objective_guardrails.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit dashboard data, objective status and screenshot assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ravi-dashboard/data/trades.json ravi-dashboard/data/objective_status.json ravi-dashboard/assets/screenshots ravi-trading-journal-os/config/trading_objectives.json
          git diff --cached --quiet || git commit -m "Run Ravi full pipeline and refresh dashboard objectives/data/assets"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ravi-dashboard
      - name: 06 - Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4