name: Ravi Trading Journal OS Trade Import

on:
  workflow_dispatch:

jobs:
  trade-import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r ravi-trading-journal-os/requirements.txt

      - name: Run trade import placeholder
        run: python ravi-trading-journal-os/scripts/run_trade_import.py
